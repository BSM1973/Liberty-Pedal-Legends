name: PEDAL LEGENDS - Mac notarized PKG and Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PEDAL_LEGENDS_VERSION: "0.6.1"

jobs:
  native:
    name: ${{ matrix.os }} - native plugin and installer
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Configure JUCE 8.0.10 (macOS Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DPEDAL_LEGENDS_BUILD_PLUGIN=ON -DPEDAL_LEGENDS_BUILD_TESTS=ON

      - name: Configure JUCE 8.0.10 (Windows x64)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPEDAL_LEGENDS_BUILD_PLUGIN=ON -DPEDAL_LEGENDS_BUILD_TESTS=ON

      - name: Build DSP tests and native formats
        run: cmake --build build --config Release --parallel 3

      - name: Run portable DSP regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Import Apple Developer ID certificates (same as ECHO 86)
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: bash Installer/macos/prepare_signing.sh

      - name: Package and submit macOS AU + VST3 to Apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: bash Installer/macos/build_pkg.sh "$PEDAL_LEGENDS_VERSION"

      - name: Upload Apple signed and notarized installer
        if: runner.os == 'macOS' && env.PEDAL_NOTARIZED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PEDAL-LEGENDS-macOS-SIGNED-NOTARIZED
          path: dist/installers/*-SIGNED-NOTARIZED.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 60

      - name: Upload unsigned test-only installer
        if: runner.os == 'macOS' && env.PEDAL_NOTARIZED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PEDAL-LEGENDS-macOS-TEST-UNSIGNED
          path: dist/installers/*-TEST-unsigned.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Package Windows x64 VST3 as EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Installer/windows/build_installer.ps1 -Version "$env:PEDAL_LEGENDS_VERSION"

      - name: Upload Windows VST3 EXE installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PEDAL-LEGENDS-windows-2022-INSTALLER
          path: dist/installers/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 60

      - name: Upload native plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pedal-legends-${{ matrix.os }}-native
          path: build/PedalLegends_artefacts/Release/
          if-no-files-found: error

  dsp-linux:
    name: Ubuntu - portable DSP and installer checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate macOS installer scripts
        run: |
          bash -n Installer/macos/prepare_signing.sh
          bash -n Installer/macos/build_pkg.sh
      - name: Configure without JUCE
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPEDAL_LEGENDS_BUILD_PLUGIN=OFF -DPEDAL_LEGENDS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Run DSP and packaging regression tests
        run: ctest --test-dir build --output-on-failure
